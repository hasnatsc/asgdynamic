<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASG Loom ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f3; --surface:#ffffff; --surface-2:#f7f8f7; --surface-3:#eef0ef;
  --ink:#1c2023; --ink-2:#464c52; --muted:#737a81; --faint:#a3a9ae;
  --line:#e2e5e4; --line-2:#eceeed;
  --brand:#b3392c; --brand-hover:#962f24; --brand-ink:#ffffff; --brand-soft:#fbecea;
  --focus:#2a78d6; --teal:#2a9d96; --teal-soft:rgba(42,157,150,.14);
  --ok:#1d7f46; --ok-bg:#e3f3e9; --info:#2466c9; --info-bg:#e7effc;
  --warn:#9a6410; --warn-bg:#fcefd6; --bad:#c0392b; --bad-bg:#fbe7e4;
  --crit:#fff; --crit-bg:#b3392c; --mute:#5f666d; --mute-bg:#eceeef;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948;
  --s-good:#1e9e4a; --s-warn:#e9a21b; --s-serious:#ec835a; --s-crit:#d03b3b; --s-none:#b8bec3;
  --grid:#e8eae9; --axis:#c9cdcb;
  --shadow:0 1px 2px rgba(20,24,28,.05),0 1px 1px rgba(20,24,28,.03);
  --shadow-pop:0 12px 32px rgba(20,24,28,.16),0 2px 6px rgba(20,24,28,.08);
  --r:8px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101214; --surface:#181b1e; --surface-2:#1d2124; --surface-3:#23282c;
    --ink:#e8eaeb; --ink-2:#c0c5ca; --muted:#8e959c; --faint:#646b72;
    --line:#2b3035; --line-2:#23282c;
    --brand:#d0574a; --brand-hover:#e06a5d; --brand-soft:#3a201c;
    --focus:#5d97ec; --teal:#38b5ad; --teal-soft:rgba(56,181,173,.16);
    --ok:#4cc27e; --ok-bg:#16301f; --info:#6aa2f0; --info-bg:#172840;
    --warn:#e3ad4f; --warn-bg:#35280f; --bad:#ec6f62; --bad-bg:#3b1b18;
    --crit:#fff; --crit-bg:#c2463a; --mute:#a3aab0; --mute-bg:#262b2f;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9a2f; --c7:#9085e9; --c8:#e66767;
    --grid:#262b2f; --axis:#3a4046;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-pop:0 12px 32px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101214; --surface:#181b1e; --surface-2:#1d2124; --surface-3:#23282c;
  --ink:#e8eaeb; --ink-2:#c0c5ca; --muted:#8e959c; --faint:#646b72;
  --line:#2b3035; --line-2:#23282c;
  --brand:#d0574a; --brand-hover:#e06a5d; --brand-soft:#3a201c;
  --focus:#5d97ec; --teal:#38b5ad; --teal-soft:rgba(56,181,173,.16);
  --ok:#4cc27e; --ok-bg:#16301f; --info:#6aa2f0; --info-bg:#172840;
  --warn:#e3ad4f; --warn-bg:#35280f; --bad:#ec6f62; --bad-bg:#3b1b18;
  --crit:#fff; --crit-bg:#c2463a; --mute:#a3aab0; --mute-bg:#262b2f;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9a2f; --c7:#9085e9; --c8:#e66767;
  --grid:#262b2f; --axis:#3a4046;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 12px 32px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--sans);font-size:13px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info);text-decoration:none}
a:hover{text-decoration:underline}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:-.01em}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.nowrap{white-space:nowrap}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
svg.i.sm{width:14px;height:14px} svg.i.lg{width:18px;height:18px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:16px;height:52px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;background:none;border:0;padding:0}
.brand .mark{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:var(--brand)}
.brand .word{font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand .word span{font-weight:400;color:var(--muted)}
.ctx{margin-left:auto;display:flex;align-items:center;gap:0;min-width:0;font-size:12px;color:var(--muted)}
.ctx b{color:var(--ink);font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ctx .sep{color:var(--faint);margin:0 10px}
.ctx .c{white-space:nowrap}
.gsearch{position:relative;width:220px;flex:none}
.gsearch input{width:100%;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);padding:0 30px 0 12px;font-size:12.5px}
.gsearch input::placeholder{color:var(--muted)}
.gsearch .i{position:absolute;right:9px;top:8px;color:var(--ink-2)}
.gres{position:absolute;right:0;top:38px;width:380px;max-height:420px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-pop);padding:6px;z-index:60}
.gres .grp{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.gres button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer}
.gres button:hover,.gres button.on{background:var(--surface-3)}
.gres .sub{color:var(--muted);font-size:11.5px;margin-left:auto;white-space:nowrap}
.tb-icons{display:flex;align-items:center;gap:4px}
.ib{position:relative;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:7px;border:0;background:none;color:var(--ink-2);cursor:pointer}
.ib:hover{background:var(--surface-3);color:var(--ink)}
.ib .dot{position:absolute;top:5px;right:5px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--brand);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;line-height:1}
.user{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:7px;font-size:12.5px}
.user:hover{background:var(--surface-3)}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:11px}

/* ---------- module bar ---------- */
.modbar{margin:12px 20px 0;display:flex;align-items:center;gap:2px;min-height:42px;padding:0 8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.modbar::-webkit-scrollbar{display:none}
.modbar .mhome{flex:none}
.modbar .mname{display:flex;align-items:center;gap:8px;font-weight:600;padding:0 14px 0 8px;margin-right:6px;border-right:1px solid var(--line);height:26px;white-space:nowrap}
.modbar .mname .ai{width:20px;height:20px}
.mbtn{display:flex;align-items:center;gap:4px;border:0;background:none;height:30px;padding:0 10px;border-radius:6px;cursor:pointer;white-space:nowrap;color:var(--ink);font-size:12.5px}
.mbtn:hover,.mbtn.open{background:var(--surface-3)}
.mbtn.cur{color:var(--brand);font-weight:600}
.menu{position:fixed;z-index:70;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-pop);padding:6px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12.5px}
.menu button:hover{background:var(--surface-3)}
.menu button.cur{color:var(--brand);font-weight:600}
.menu .hint{margin-left:auto;color:var(--muted);font-size:11px;font-family:var(--mono)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .mh{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 10px 2px}

/* ---------- page ---------- */
main{padding:18px 20px 64px;min-height:calc(100vh - 110px)}
.phead{display:flex;align-items:flex-end;gap:16px;margin:4px 0 14px;flex-wrap:wrap}
.phead h1{font-size:20px;line-height:1.2;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.phead .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.crumbs{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.crumbs button{border:0;background:none;padding:0;color:var(--ink-2);cursor:pointer;display:flex;gap:4px;align-items:center;font-size:12px}
.crumbs button:hover{color:var(--brand)}
.crumbs .s{color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2);min-height:46px}
.card-h h3{margin:0;font-size:13.5px;font-weight:600}
.card-h .meta{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11.5px}
.card-b{padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.sec-t{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sec-t:after{content:"";flex:1;height:1px;background:var(--line)}
.sec-t .x{letter-spacing:0;text-transform:none;font-weight:500;color:var(--bad)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--faint);background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.outline-brand{border-color:var(--brand);color:var(--brand)}
.btn.sm{height:27px;padding:0 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-3)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.act{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid transparent;cursor:pointer;background:var(--ok-bg);color:var(--ok)}
.act.blue{background:var(--info-bg);color:var(--info)}
.act.amber{background:var(--warn-bg);color:var(--warn)}
.act.red{background:var(--bad-bg);color:var(--bad)}
.act.grey{background:var(--mute-bg);color:var(--mute)}
.act:hover{border-color:currentColor}
.acts{display:flex;gap:6px;justify-content:flex-end}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--mute-bg);color:var(--mute)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;border:1px solid var(--line);font-size:11px;color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:12px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip.on .n{color:inherit;opacity:.75}

/* ---------- forms ---------- */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:11.5px;color:var(--ink-2);font-weight:500}
.fld .req{color:var(--bad)}
.inp,.sel,textarea.inp{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;font-size:12.5px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.inp:focus,.sel:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.inp[readonly]{background:var(--surface-2);color:var(--ink-2)}
.fld .hint{font-size:11px;color:var(--muted)}
.fld.err .inp{border-color:var(--bad)}
.fld .emsg{font-size:11px;color:var(--bad)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid .full{grid-column:1/-1}
.fsec{grid-column:1/-1;font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-top:6px;padding-top:10px;border-top:1px solid var(--line-2)}
.fsec:first-child{margin-top:0;padding-top:0;border-top:0}

/* ---------- tables ---------- */
.tools{display:flex;align-items:center;gap:8px;padding:12px 14px;flex-wrap:wrap}
.tools .search{position:relative;flex:1 1 280px;max-width:420px}
.tools .search input{padding-left:32px}
.tools .search .i{position:absolute;left:10px;top:8px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:8px;margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:500}
.pager .ib{width:26px;height:26px;border:1px solid var(--line)}
.tw{overflow-x:auto;border-top:1px solid var(--line-2)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;font-size:11.5px;color:var(--ink);padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--brand)}
.tbl th .ar{color:var(--brand);margin-left:3px;font-size:10px}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:9px 9px;white-space:nowrap;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tbody tr.click{cursor:pointer}
.tbl td.sl{color:var(--muted);width:40px}
.tbl td.wrap{white-space:normal;min-width:160px}
.phead>.row+.crumbs{margin-left:16px}
.tbl .strong{font-weight:600}
.tbl tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0}
.tfoot{display:flex;align-items:center;gap:8px;padding:10px 14px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.tfoot select{height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 6px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.bar-in{position:relative;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:60px}
.bar-in i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--teal)}
.qp{display:flex;align-items:center;gap:8px}
.qp .bar-in{flex:1}
.qp .mono{width:44px;text-align:right}

/* ---------- KPI ---------- */
.kpi{padding:14px 16px 13px;border-left:3px solid var(--k,var(--line));border-radius:var(--r);background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:var(--shadow);min-width:0;cursor:default}
.kpi.click{cursor:pointer}
.kpi.click:hover{background:var(--surface-2)}
.kpi .l{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.kpi .l .i{color:var(--k,var(--muted))}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:6px 0 3px;white-space:nowrap}
.kpi .v small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.kpi .f{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600;font-family:var(--mono)}
.delta.up{background:var(--ok-bg);color:var(--ok)} .delta.dn{background:var(--bad-bg);color:var(--bad)} .delta.fl{background:var(--mute-bg);color:var(--mute)}
.ov{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.ovc{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12px;cursor:pointer}
.ovc:hover{border-color:var(--faint)}
.ovc b{font-weight:600}
.ovc .d{width:7px;height:7px;border-radius:50%;background:var(--s-good);flex:none}
.ovc.warn .d{background:var(--s-warn)} .ovc.bad .d{background:var(--s-crit)}
.ovc .t{color:var(--muted)}
.att{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.att button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--s-crit);border-radius:6px;background:var(--surface);cursor:pointer;min-width:0}
.att button.w{border-left-color:var(--s-warn)} .att button.i{border-left-color:var(--c1)} .att button.g{border-left-color:var(--s-good)}
.att button:hover{background:var(--surface-2)}
.att .n{font-size:20px;font-weight:600;font-family:var(--mono);letter-spacing:-.03em}
.att .t{font-size:12.5px;font-weight:500;line-height:1.25}
.att .s{font-size:11px;color:var(--muted);line-height:1.3;margin-top:2px}

/* ---------- launcher ---------- */
.home{max-width:960px;margin:0 auto;padding-top:22px}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.home h2{font-size:22px;font-weight:600;margin:8px 0 2px;letter-spacing:-.01em}
.home .date{color:var(--muted);font-size:12.5px}
.bigsearch{position:relative;max-width:420px;margin:20px 0 26px}
.bigsearch input{height:40px;padding:0 64px 0 36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);width:100%;box-shadow:var(--shadow);font-size:13px}
.bigsearch .i{position:absolute;left:12px;top:12px;color:var(--ink-2)}
.bigsearch kbd{position:absolute;right:10px;top:10px;font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);background:var(--surface-2)}
.needs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.needs button{display:flex;align-items:center;gap:16px;text-align:left;padding:18px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;min-height:84px}
.needs button:hover{border-color:var(--faint)}
.needs .n{font-size:24px;font-weight:300;min-width:24px}
.needs .t{font-weight:600;font-size:12.5px}
.needs .s{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.needs .i{margin-left:auto;color:var(--ink-2)}
.apps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:26px 12px;margin-top:6px}
.app{display:flex;flex-direction:column;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:4px;border-radius:10px;text-align:center}
.app .ic{width:66px;height:66px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,24,28,.06);display:grid;place-items:center;transition:transform .15s ease, box-shadow .15s ease}
.app:hover .ic{transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,24,28,.10)}
.app .nm{font-size:12px;font-weight:500;line-height:1.3;max-width:120px}
.app .ph{font-size:10px;color:var(--muted);margin-top:-6px}
.ai{width:40px;height:40px}

/* ---------- charts ---------- */
.chart{width:100%;display:block}
.chart text{font-family:var(--sans);fill:var(--muted);font-size:11px}
.chart .tick{font-family:var(--mono);font-size:10.5px}
.chart .lbl{fill:var(--ink);font-size:11.5px}
.chart .val{fill:var(--ink-2);font-family:var(--mono);font-size:10.5px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.ln{height:2px;width:14px;border-radius:1px}
.legend i.dash{height:0;width:14px;border-top:2px dashed var(--ink-2);border-radius:0;background:none!important}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:0 10px;height:26px;font-size:12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}
.pipe{display:flex;flex-direction:column;gap:10px}
.pipe button{display:block;text-align:left;border:0;background:none;padding:0;cursor:pointer;width:100%}
.pipe .hd{display:flex;align-items:center;gap:8px;font-size:12.5px}
.pipe .hd .d{width:8px;height:8px;border-radius:50%}
.pipe .hd .v{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.pipe .hd .v b{color:var(--ink);font-weight:600;margin-right:6px}
.pipe .tr{height:5px;border-radius:3px;background:var(--surface-3);margin-top:5px;overflow:hidden}
.pipe .tr i{display:block;height:100%;border-radius:3px}
.pipe button:hover .hd span:nth-child(2){color:var(--brand)}
.stackbar{display:flex;height:12px;border-radius:3px;overflow:hidden;gap:2px;background:var(--surface)}
.stackbar i{display:block;height:100%}

/* ---------- 360 ---------- */
.hero360{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;padding:16px}
.hero360 .sw{width:52px;height:52px;border-radius:10px;border:1px solid var(--line);flex:none;background:repeating-linear-gradient(45deg,var(--surface-3) 0 4px,var(--surface-2) 4px 8px)}
.hero360 h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.hero360 .facts{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--ink-2);font-size:12px;margin-top:6px}
.hero360 .facts b{font-weight:600;color:var(--ink)}
.track{display:grid;grid-template-columns:repeat(9,minmax(96px,1fr));gap:0;overflow-x:auto;padding:16px 16px 18px}
.st{position:relative;padding:0 6px;text-align:center}
.st:before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:2px;background:var(--line)}
.st:first-child:before{display:none}
.st.done:before,.st.cur:before{background:var(--teal)}
.st .b{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:11px;font-weight:600}
.st.done .b{background:var(--teal);border-color:var(--teal);color:#fff}
.st.cur .b{border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.st .n{font-size:11.5px;font-weight:600;margin-top:8px}
.st .q{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 12px 10px;font-size:12.5px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;color:var(--ink-2)}
.tabs button.on{border-color:var(--brand);color:var(--ink);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line-2)}
.kv>div{padding:10px 16px;border-bottom:1px solid var(--line-2);min-width:0}
.kv .k{font-size:11px;color:var(--muted)}
.kv .v{font-size:12.5px;font-weight:500;margin-top:2px;overflow-wrap:anywhere}
.kv.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tl{display:flex;flex-direction:column;gap:0;padding:4px 16px 12px}
.tl .it{display:grid;grid-template-columns:110px 16px 1fr;gap:10px;padding:8px 0}
.tl .dt{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}
.tl .pt{width:10px;height:10px;border-radius:50%;background:var(--teal);margin-top:4px;box-shadow:0 0 0 3px var(--teal-soft)}
.tl .pt.b{background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.tl .tx{font-size:12.5px}
.tl .tx small{display:block;color:var(--muted);font-size:11.5px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,18,20,.42);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto;animation:fade .12s ease}
.modal{width:min(640px,100%);background:var(--surface);border-radius:12px;box-shadow:var(--shadow-pop);border:1px solid var(--line);animation:pop .14s ease}
.modal.wide{width:min(960px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.modal .mh.brandish{background:var(--warn-bg)}
.modal .mh.brandish h3{color:var(--warn)}
.modal .mb{padding:16px 18px;max-height:70vh;overflow:auto}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.note{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:6px;background:var(--info-bg);color:var(--info);font-size:12px;margin-bottom:12px}
.note.warn{background:var(--warn-bg);color:var(--warn)} .note.bad{background:var(--bad-bg);color:var(--bad)} .note.ok{background:var(--ok-bg);color:var(--ok)}
.note b{font-weight:600}
.toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow-pop);font-size:12.5px;max-width:360px;animation:pop .16s ease}
.toast .i{color:#7ee0a5}
.tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink);color:var(--surface);font-size:11.5px;padding:6px 9px;border-radius:6px;max-width:280px;box-shadow:var(--shadow-pop);line-height:1.35}
.tip b{font-weight:600}
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:50;width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(179,57,44,.35);cursor:pointer}
.fab:hover{background:var(--brand-hover)}
.drawer{position:fixed;right:22px;bottom:84px;z-index:85;width:min(360px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop)}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center}
.drawer dl{margin:0;padding:8px 16px 14px}
.drawer dt{font-weight:600;font-size:12.5px;margin-top:10px;font-family:var(--mono)}
.drawer dd{margin:2px 0 0;color:var(--ink-2);font-size:12px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stp{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);border-top:3px solid var(--line)}
.stp.done{border-top-color:var(--s-good)} .stp.cur{border-top-color:var(--brand)}
.stp .no{font-family:var(--mono);font-size:11px;color:var(--muted)}
.stp .t{font-weight:600;margin:4px 0 2px}
.stp .s{font-size:12px;color:var(--ink-2);min-height:34px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%}
.progress{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--teal)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .g6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .att{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ctx .c.opt{display:none}
}
@media (max-width:900px){
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g-2-1,.g-1-2{grid-template-columns:minmax(0,1fr)}
  .needs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .apps{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ctx{display:none}
  .gsearch{margin-left:auto;width:180px}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .topbar{padding:0 16px;gap:8px}
  .gsearch{display:none}
  .user .nm{display:none}
  .modbar{margin:10px 16px 0}
  main{padding:14px 16px 72px}
  .g6,.g4,.g3,.att,.needs{grid-template-columns:minmax(0,1fr)}
  .g6.m2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .apps{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 6px}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .crumbs{display:none}
  .kv,.kv.c3{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:minmax(0,1fr)}
  .tools .search{flex-basis:100%;max-width:none}
  .pager{margin-left:0}
}
[hidden]{display:none!important}

</style>

let popEl = null;
function closePop() { if (popEl) { popEl.remove(); popEl = null; } $$('.mbtn.open').forEach(b => b.classList.remove('open')); const g = $('#gres'); if (g) g.innerHTML = ''; }
function pop(anchor, html, opts = {}) {
  closePop(); const m = document.createElement('div'); m.className = 'menu'; m.innerHTML = html; document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(); const w = m.offsetWidth; let x = opts.right ? r.right - w : r.left; x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
  let y = r.bottom + 6; if (y + m.offsetHeight > window.innerHeight - 8) y = Math.max(8, r.top - m.offsetHeight - 6);
  m.style.left = x + 'px'; m.style.top = y + 'px'; popEl = m; return m;

function modal({title, body, actions = [], wide = false, tone = '', onOpen}) {

  s._actions = actions; document.body.appendChild(s);
  s.addEventListener('mousedown', e => { if (e.target === s) closeModal(s); });
  const f = s.querySelector('input:not([readonly]),select,textarea'); if (f) setTimeout(() => f.focus(), 30);
  if (onOpen) onOpen(s); return s;

function closeModal(s) { (s || $$('.scrim').pop())?.remove(); }

document.addEventListener('mousemove', e => { if (!tipEl) return; const w = tipEl.offsetWidth, h = tipEl.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14; tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; });

/* ============ event delegation ============ */
const A = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) { if (popEl && !e.target.closest('.menu')) closePop(); if (!e.target.closest('.gsearch')) { const g = $('#gres'); if (g) g.innerHTML = ''; } const d = $('.drawer'); if (d && !e.target.closest('.drawer')) d.remove(); return; }
  const f = A[el.dataset.a]; if (!f) { console.warn('No action', el.dataset.a); return; }
  if (!el.closest('.menu') && el.dataset.a !== 'modmenu' && el.dataset.a !== 'usermenu' && el.dataset.a !== 'notif' && !el.dataset.keep) closePop();
  e.preventDefault(); f(el, e);
});

function vbars(w, o) {

  const T = ticks(Math.max(...tot, o.ref ? o.ref.v : 0, 1)); const top = T.at(-1); const Y = v => pt + ih - v / top * ih;
  const band = iw / nC, gap = Math.min(6, band * .18); const nS = o.stacked ? 1 : o.series.length; const bw = Math.max(2, Math.min(o.maxBar || 42, (band - gap * 2) / nS - (nS > 1 ? 2 : 0)));

  T.forEach(t => { s += `<line x1="${pl}" x2="${w - pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t === 0 ? 'var(--axis)' : 'var(--grid)'}"/><text class="tick" x="${pl - 8}" y="${Y(t) + 3.5}" text-anchor="end">${yf(t)}</text>`; });

  const bins = [[1, 7], [8, 15], [16, 30], [31, 60], [61, 90], [91, 999]]; const bl = bins.map(b => late.filter(l => -l._days >= b[0] && -l._days <= b[1]));

  h += `<div class="grid g2" style="margin-top:14px"><div class="card"><div class="card-h"><h3>How late are the late lines?</h3><div class="meta">days past TNA</div></div><div class="card-b">${chart(w => vbars(w, {cats: bins.map(b => ({label: b[1] > 900 ? '90+ days' : `${b[0]}–${b[1]} d`})), series: [{name: 'Lines', color: 'var(--s-crit)', vals: bl.map(x => x.length)}], h: 230, yfmt: v => String(v), maxBar: 48, tip: i => `<b>${bins[i][0]}–${bins[i][1] > 900 ? '…' : bins[i][1]} days late</b><br>${bl[i].length} lines · ${fmt(sum(bl[i], l => l._bal))} yds open`, act: i => ({a: 'orders-latebin', v: bins[i].join('-')}), label: 'Days late distribution'}), 230)}</div></div>
    <div class="card"><div class="card-h"><h3>Excel flag vs ASG Loom rule</h3><div class="meta">same 485 lines</div></div><div class="card-b"><div style="font-size:12px;font-weight:600;margin-bottom:6px">Workbook "On-Time/Delay" column</div>${stackbar(xl.map((x, i) => ({k: x.k, v: x.v, c: ['var(--s-crit)', 'var(--s-good)', 'var(--s-none)'][i]})), L.length, p => `${p.k}: ${p.v} lines`)}<div style="margin:6px 0 16px">${legend(xl.map((x, i) => ({k: `${x.k} ${x.v}`, c: ['var(--s-crit)', 'var(--s-good)', 'var(--s-none)'][i]})))}</div>

/* ============ generic form modal ============ */
function lineOptions() { return L.map(l => `<option value="${esc(`${l.dispo || 'TBA'} · ${l.color || '—'} · ${(l.buyer || '').slice(0, 24)} [${l.id}]`)}"></option>`).join(''); }
function fieldHtml(f) {
  if (f.type === 'sec') return `<div class="fsec">${esc(f.label)}</div>`;
  if (f.type === 'info') return `<div class="full">${f.html}</div>`;
  const id = 'f-' + f.k; const full = f.full || f.type === 'textarea' || f.type === 'line' ? 'full' : '';
  let inp;
  if (f.type === 'select') inp = `<select class="sel" id="${id}">${f.blank !== false ? '<option value="">Select…</option>' : ''}${(f.options || []).map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(f.v ?? '') === String(v) ? 'selected' : ''}>${esc(t)}</option>`; }).join('')}</select>`;
  else if (f.type === 'textarea') inp = `<textarea class="inp" id="${id}">${esc(f.v ?? '')}</textarea>`;
  else if (f.type === 'line') { const l = f.v ? LBY[f.v] : null; inp = l ? `<input class="inp" id="${id}" readonly value="${esc(`${l.dispo || 'TBA'} · ${l.color || '—'} · ${(l.buyer || '').slice(0, 24)} [${l.id}]`)}">` : `<input class="inp" id="${id}" list="dl-lines" placeholder="Type a DISPO number or colour, then pick" autocomplete="off"><datalist id="dl-lines">${lineOptions()}</datalist>`; }
  else if (f.type === 'datalist') inp = `<input class="inp" id="${id}" list="dl-${f.k}" value="${esc(f.v ?? '')}" autocomplete="off"><datalist id="dl-${f.k}">${(f.options || []).map(o => `<option value="${esc(o)}"></option>`).join('')}</datalist>`;
  else inp = `<input class="inp ${f.type === 'number' ? 'mono' : ''}" id="${id}" type="${f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text'}" ${f.type === 'number' ? 'step="any" inputmode="decimal"' : ''} value="${esc(f.v ?? '')}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}>`;
  return `<div class="fld ${full}" data-fk="${f.k}"><label for="${id}">${esc(f.label)}${f.req ? ' <span class="req">*</span>' : ''}</label>${inp}${f.hint ? `<div class="hint">${f.hint}</div>` : ''}<div class="emsg"></div></div>`;
}
function fieldErr(s, k, msg) { const w = s.querySelector(`[data-fk="${k}"]`); if (!w) { toast(msg); return; } w.classList.add('err'); w.querySelector('.emsg').textContent = msg; }
function readForm(s, fields) {
  s.querySelectorAll('.fld.err').forEach(x => { x.classList.remove('err'); x.querySelector('.emsg').textContent = ''; });
  const v = {}; let ok = true;
  for (const f of fields) {
    if (f.type === 'sec' || f.type === 'info') continue; const el = s.querySelector('#f-' + f.k); if (!el) continue; let x = el.value.trim();
    if (f.type === 'line') { const m = x.match(/\[(L\d+|N\d+)\]$/); x = m ? m[1] : ''; if (!x || !LBY[x]) { if (f.req !== false) { fieldErr(s, f.k, 'Pick a DISPO line from the list'); ok = false; } continue; } }
    if (f.req && x === '') { fieldErr(s, f.k, 'Required'); ok = false; continue; }
    if (f.type === 'number') { if (x === '') { v[f.k] = null; continue; } const num = Number(x); if (!isFinite(num)) { fieldErr(s, f.k, 'Enter a number'); ok = false; continue; } if (f.min != null && num < f.min) { fieldErr(s, f.k, `Must be at least ${f.min}`); ok = false; continue; } v[f.k] = num; }
    else v[f.k] = x;
  }
  return ok ? v : null;
}
function form({title, fields, note, save, wide, submit = 'Save', check}) {
  const body = `${note ? `<div class="note">${ico('info')}<span>${note}</span></div>` : ''}<form class="fgrid" onsubmit="return false">${fields.map(fieldHtml).join('')}</form>`;
  modal({title, body, wide, actions: [{label: 'Cancel'}, {label: submit, primary: true, fn: s => { const v = readForm(s, fields); if (!v) return false; if (check) { const e = check(v); if (e) { fieldErr(s, e.k, e.msg); return false; } } return save(v); }}]});
}

  const cell = v => v === 'A' ? '<span class="pill ok" data-tip="View, post and approve">Approve</span>' : v === 'P' ? '<span class="pill info" data-tip="View and post entries">Post</span>' : v === 'V' ? '<span class="pill" data-tip="Read only">View</span>' : '<span class="muted">—</span>';
  return phead('Users & Roles', [['master', 'Core & Security'], 'Users & Roles'], 'Each role sees only its apps. Approve includes post and view.') +
    `<div class="card"><div class="card-h"><h3>Demo users</h3><div class="meta">switch from the user menu</div></div><div class="tw" style="border:0"><table class="tbl"><thead><tr><th>User</th><th>Role</th><th>Status</th><th class="r">Actions</th></tr></thead><tbody>${USERS.map(u => `<tr><td><div class="row"><span class="avatar">${u.ini}</span><b style="font-weight:500">${esc(u.name)}</b></div></td><td>${esc(u.role)}</td><td>${u.id === STATE.user.id ? '<span class="pill ok">Signed in</span>' : '<span class="pill">Active</span>'}</td><td><div class="acts"><button class="btn sm" data-a="setuser" data-u="${u.id}">Sign in as</button></div></td></tr>`).join('')}</tbody></table></div></div>
    <div class="card" style="margin-top:14px"><div class="card-h"><h3>Role × app access</h3></div><div class="tw" style="border:0"><table class="tbl matrix"><thead><tr><th>Role</th>${APPS.map(a => `<th title="${esc(a.name)}">${esc(a.name.split(' ')[0])}</th>`).join('')}</tr></thead><tbody>${roles.map(([r, m]) => `<tr><td><b style="font-weight:500">${r}</b></td>${APPS.map(a => `<td>${cell(m[a.id])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
});

/* ============ ROLLOUT PLAN ============ */
route('rollout', 'core', 'Rollout Plan', () => {
  const map = [['Dispo Information (29 cols)', 'BPO · DISPO · DISPO line · FTD', 'Merchandising, Technical'], ['TNA (4 + 3 cols)', 'TNA milestone; lead times derived', 'Planning'], ['Yarn Status (20)', 'Yarn issue transactions', 'Yarn & Store'], ['Preparatory Production (12)', 'Warping / sizing entries', 'Weaving'], ['Weaving Production (13)', 'Loom production, outside weaving orders', 'Weaving'], ['Folding Status (12)', 'Folding entries (good / B / reject)', 'Grey Store'], ['Grey Issue Status (11)', 'Grey issue, grey transfer', 'Grey Store'], ['17 process groups (157)', 'Process entry per pass', 'Processing'], ['Final Inspection (13)', 'Inspection roll', 'Quality'], ['Finished Delivery Status (14)', 'Delivery challan, DO / PI / LC', 'Delivery & Commercial'], ['On-Time & Delay Status (6)', 'Risk class, delay reason (derived + coded)', 'Dashboards'], ['Freeze Plan (6)', 'Freeze plan by mill and month', 'Planning']];
  return phead('Rollout Plan', [['master', 'Core & Security'], 'Rollout Plan'], 'From the Excel master chart to ASG Loom in four phases. The full plan is a separate document.', `<div class="row" style="margin-left:auto"><a class="btn primary" href="https://claude.ai/code/artifact/c9a667e2-c406-4e8d-b314-05ea4b483f7d" target="_blank" rel="noopener">${ico('file')}Open the software plan</a></div>`) +
    `<div class="steps">${[['Phase 0 · Oct 2026 · 4 weeks', 'Foundation', 'Clean master lists, import the 22-Sep chart, sign off this prototype.', 'G1 · data parity: 485 lines, 8.33M yds match'], ['Phase 1 · Nov–Dec 2026 · 8 weeks', 'Order book & Control Tower', 'BPO, DISPO, FTD, TNA, Command Center, data checks, daily report. Workbook imported each morning.', 'G2 · tower used in the daily meeting for 2 weeks'], ['Phase 2 · Jan–Mar 2027 · 12 weeks', 'Floor entry', 'Yarn to delivery posted by each department on phone-size forms; outside mills via import.', 'G3 · all departments post for 30 days, < 1% corrections'], ['Phase 3 · Apr–Jun 2027 · 12 weeks', 'Commercial & finance', 'LC, bank submission, collection, costing vs actual, links to ASG Spindle and ASG HCM.', 'Master chart frozen as history']].map(([a, b, c, d], i) => `<div class="stp ${i === 0 ? 'cur' : ''}"><div class="no">${a}</div><div class="t">${b}</div><div class="s">${c}</div><div style="margin-top:10px;font-size:11.5px;color:var(--brand);font-weight:600">${d}</div></div>`).join('')}</div>
    <div class="card" style="margin-top:14px"><div class="card-h"><h3>Where each workbook section goes</h3><div class="meta">312 columns → 12 modules</div></div><div class="tw" style="border:0"><table class="tbl"><thead><tr><th>Workbook section</th><th>ASG Loom record</th><th>App</th></tr></thead><tbody>${map.map(r => `<tr><td><b style="font-weight:500">${r[0]}</b></td><td>${r[1]}</td><td><span class="tag">${r[2]}</span></td></tr>`).join('')}</tbody></table></div></div>`;
});

/* boot */
render();

</script>

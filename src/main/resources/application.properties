spring.application.name=fabricerp

# ---------------------------------------------------------------------------
# PostgreSQL - point at the existing ERP database
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fabricerp}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:asg2020}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.pool-name=asg-pool

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# NEVER 'update' or 'create' against the legacy database.
# Schema changes go through Flyway migrations only.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Dhaka
# Quote identifiers so mixed-case legacy column names survive PostgreSQL folding.
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# New database: Flyway builds the schema from V1 onward. Never ddl-auto.
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0

# ---------------------------------------------------------------------------
# Thymeleaf
# ---------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---------------------------------------------------------------------------
# Cache (fabric costings are immutable once finally approved upstream)
# ---------------------------------------------------------------------------
spring.cache.cache-names=fabricCost

# ---------------------------------------------------------------------------
# Server / session
# ---------------------------------------------------------------------------
server.port=8080
server.servlet.session.cookie.http-only=true
# Requires HTTPS. The legacy app served login and sessions over plain HTTP.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------------
# External fabric costing API
# ---------------------------------------------------------------------------
asg.costing.base-url=${COSTING_BASE_URL:https://costing.amanatshahfabrics.com}
# Credentials MUST come from the environment or a secret store.
# The previous values were embedded in client-side JavaScript on the Booking and
# BPO screens and are considered compromised - rotate before first use.
asg.costing.user=${COSTING_USER:}
asg.costing.password=${COSTING_PASSWORD:}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.asg.fabricerp=DEBUG

# Fail fast if an entity does not match the migrated schema.
spring.jpa.properties.hibernate.hbm2ddl.auto=none
app.timezone=Asia/Dhaka

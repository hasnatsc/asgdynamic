<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="${title}">Roles</title>
</head>
<body>
<div th:fragment="content">

    <div class="flex items-center justify-between mb-5">
        <div>
            <h1 class="text-xl font-semibold" th:text="${title}">Roles</h1>
            <p class="text-sm text-slate-500">Named, reusable bundles of permissions.</p>
        </div>
        <button type="button" class="btn-primary" id="roleNewBtn">Add</button>
    </div>

    <div class="card overflow-hidden">
        <table id="roleTable" class="table-grid">
            <thead>
            <tr>
                <th data-sort="name">Name</th>
                <th>Description</th>
                <th>Permissions</th>
                <th data-sort="active">Active</th>
                <th class="text-right">Action</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <form id="roleForm" class="card mt-6 p-5 space-y-4">
        <input type="hidden" id="roleId">

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
                <label class="label" for="roleName">Name</label>
                <input id="roleName" class="field" maxlength="80" required>
            </div>
            <div>
                <label class="label" for="roleDescription">Description</label>
                <input id="roleDescription" class="field" maxlength="255">
            </div>
        </div>

        <label class="inline-flex items-center gap-2 text-sm">
            <input type="checkbox" id="roleActive" class="rounded border-slate-300" checked>
            <span>Active</span>
        </label>

        <div>
            <div class="label mb-2">Permissions</div>
            <div class="space-y-3" id="permissionGroups"
                 th:each="perm, stat : ${permissions}">
                <div th:if="${stat.first or permissions[stat.index - 1].module != perm.module}"
                     class="text-xs font-semibold uppercase text-slate-400 mt-3"
                     th:text="${perm.module}">MODULE</div>
                <label class="flex items-start gap-2 text-sm">
                    <input type="checkbox" class="perm-checkbox rounded border-slate-300 mt-0.5"
                           th:value="${perm.id}">
                    <span>
                        <code th:text="${perm.name}">ROLE_X</code>
                        <span class="text-slate-500" th:text="${' — ' + perm.description}"> — desc</span>
                    </span>
                </label>
            </div>
        </div>

        <div class="flex items-center gap-2 pt-2 border-t border-slate-200">
            <button type="submit" class="btn-primary">Save</button>
            <button type="button" class="btn-ghost" id="roleResetBtn">Reset</button>
        </div>
    </form>

    <script th:inline="javascript">
    (function () {
        const csrfToken  = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
        const tbody = document.querySelector('#roleTable tbody');
        const form = document.getElementById('roleForm');

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text == null ? '' : String(text).replace(/[&<>"']/g, m => map[m]);
        }

        function api(url, options) {
            options = options || {};
            options.headers = Object.assign({
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                [csrfHeader]: csrfToken
            }, options.headers || {});
            return fetch(url, options).then(res => {
                if (!res.ok) return res.json().then(body => { throw new Error(body.message || ('HTTP ' + res.status)); });
                return res.status === 204 ? null : res.json();
            });
        }

        function loadGrid() {
            fetch('/api/setup/roles?draw=1&start=0&length=500&sortColumn=name')
                .then(res => res.json())
                .then(data => renderGrid(data.data || []))
                .catch(() => { tbody.innerHTML = '<tr><td colspan="5">Failed to load roles.</td></tr>'; });
        }

        function renderGrid(rows) {
            if (rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-slate-500">No roles yet</td></tr>';
                return;
            }
            tbody.innerHTML = rows.map(r => `
                <tr>
                    <td>${escapeHtml(r.name)}</td>
                    <td>${escapeHtml(r.description)}</td>
                    <td>${r.permissionCount}</td>
                    <td>${r.active ? 'Yes' : 'No'}</td>
                    <td class="text-right">
                        <button type="button" class="btn-ghost" data-edit="${r.id}">Edit</button>
                        <button type="button" class="btn-ghost text-red-600" data-delete="${r.id}">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        tbody.addEventListener('click', function (e) {
            const editId = e.target.getAttribute('data-edit');
            const deleteId = e.target.getAttribute('data-delete');
            if (editId) edit(editId);
            if (deleteId) remove(deleteId);
        });

        function edit(id) {
            api('/api/setup/roles/' + id).then(r => {
                document.getElementById('roleId').value = r.id;
                document.getElementById('roleName').value = r.name || '';
                document.getElementById('roleDescription').value = r.description || '';
                document.getElementById('roleActive').checked = !!r.active;
                const ids = new Set((r.permissionIds || []).map(String));
                document.querySelectorAll('.perm-checkbox').forEach(cb => {
                    cb.checked = ids.has(cb.value);
                });
                form.scrollIntoView({ behavior: 'smooth' });
            }).catch(err => alert(err.message));
        }

        function remove(id) {
            if (!confirm('Delete this role?')) return;
            api('/api/setup/roles/' + id, { method: 'DELETE' })
                .then(loadGrid)
                .catch(err => alert(err.message));
        }

        function resetForm() {
            form.reset();
            document.getElementById('roleId').value = '';
            document.querySelectorAll('.perm-checkbox').forEach(cb => { cb.checked = false; });
        }

        document.getElementById('roleNewBtn').addEventListener('click', resetForm);
        document.getElementById('roleResetBtn').addEventListener('click', resetForm);

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const permissionIds = Array.from(document.querySelectorAll('.perm-checkbox:checked'))
                .map(cb => Number(cb.value));
            const rawId = document.getElementById('roleId').value;
            const payload = {
                id: rawId ? Number(rawId) : null,
                name: document.getElementById('roleName').value,
                description: document.getElementById('roleDescription').value,
                active: document.getElementById('roleActive').checked,
                permissionIds: permissionIds
            };
            api('/api/setup/roles', { method: 'POST', body: JSON.stringify(payload) })
                .then(() => { resetForm(); loadGrid(); })
                .catch(err => alert(err.message));
        });

        loadGrid();
    })();
    </script>

</div>
</body>
</html>

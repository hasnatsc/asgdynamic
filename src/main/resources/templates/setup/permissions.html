<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!--
  Read-only by design — see PermissionController's javadoc. A row here documents a
  GrantedAuthority string already compiled into a @PreAuthorize literal; there is nothing to
  create or delete from this screen.
-->
<head>
    <title th:text="${title}">Permissions</title>
</head>
<body>
<div th:fragment="content">

    <div class="mb-5">
        <h1 class="text-xl font-semibold" th:text="${title}">Permissions</h1>
        <p class="text-sm text-slate-500">
            Every authority string a controller's @PreAuthorize check can grant. Read-only —
            bundle these into a <a class="underline" th:href="@{/setup/roles}">role</a> to
            actually assign them to a user.
        </p>
    </div>

    <div class="card overflow-hidden">
        <table id="permissionTable" class="table-grid">
            <thead>
            <tr>
                <th data-sort="module">Module</th>
                <th data-sort="name">Authority</th>
                <th>Description</th>
                <th data-sort="active">Active</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
    (function () {
        const tbody = document.querySelector('#permissionTable tbody');

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text == null ? '' : String(text).replace(/[&<>"']/g, m => map[m]);
        }

        function render(rows) {
            if (rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-slate-500">No permissions</td></tr>';
                return;
            }
            tbody.innerHTML = rows.map(r => `
                <tr>
                    <td>${escapeHtml(r.module)}</td>
                    <td><code>${escapeHtml(r.name)}</code></td>
                    <td>${escapeHtml(r.description)}</td>
                    <td>${r.active ? 'Yes' : 'No'}</td>
                </tr>
            `).join('');
        }

        fetch('/api/setup/permissions?draw=1&start=0&length=500&sortColumn=module', {
            headers: { 'Accept': 'application/json' }
        })
            .then(res => res.json())
            .then(data => render(data.data || []))
            .catch(() => { tbody.innerHTML = '<tr><td colspan="4">Failed to load permissions.</td></tr>'; });
    })();
    </script>

</div>
</body>
</html>

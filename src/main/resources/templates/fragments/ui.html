<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!--
  Shared server-rendered UI pieces. Each has a client-side twin in app.js so a grid row built
  in the browser and a page rendered by Thymeleaf look identical; colours live only in
  input.css ([data-status=…]). See docs/design-system.md.
-->
<body>

<!-- Document status badge. Client twin: App.status(status). -->
<span th:fragment="status(status)" class="badge"
      th:attr="data-status=${status}" th:text="${status.label()}">Draft</span>

<!--
  Maker → checker → fulfilment rail for a BusinessDocument. Client twin: statusSteps() in app.js.
  REJECTED marks the Submitted stage as failed; CANCELLED leaves the rail and shows only its badge.
-->
<th:block th:fragment="workflow(status)" th:with="step=${status.workflowStep()}">
    <!-- th:replace runs before th:if on one element, so the condition sits on a wrapper. -->
    <th:block th:if="${step < 0}"><span th:replace="~{fragments/ui :: status(${status})}"></span></th:block>
    <ol th:if="${step >= 0}" class="steps" aria-label="Document workflow">
        <li th:each="stage, it : ${ {'Draft', 'Submitted', 'Approved', 'Completed'} }" class="step"
            th:with="failed=${it.index == step and status.name() == 'REJECTED'}"
            th:classappend="${it.index < step} ? 'is-done' : (${it.index == step} ? (${failed} ? 'is-failed' : 'is-current') : '')"
            th:attr="aria-current=${it.index == step} ? 'step' : null">
            <span class="step-dot">
                <svg th:if="${it.index < step or failed}" class="icon h-3 w-3" aria-hidden="true"><use
                     th:href="${failed} ? @{/images/icons.svg#x} : @{/images/icons.svg#check}"/></svg>
                <th:block th:unless="${it.index < step or failed}" th:text="${it.count}">1</th:block>
            </span>
            <span th:text="${it.index == step} ? ${status.label()} : ${stage}">Draft</span>
        </li>
    </ol>
</th:block>

</body>
</html>

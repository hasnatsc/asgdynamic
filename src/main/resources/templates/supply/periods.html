<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!--
  Inventory periods - the legacy Period screen. A month with no row is open; closing it stops every
  store posting dated in it (and every reversal a cancellation would write into it) until it is
  reopened, with a reason, by someone who approves.
-->
<head><title>Inventory periods</title></head>
<body>
<div th:fragment="content" data-stock-page="periods" th:attr="data-year=${year},data-can-close=${canClose},data-can-reopen=${canReopen}">

    <div class="page-header">
        <div>
            <h1 class="page-title">Inventory periods</h1>
            <p class="page-sub">Close a month once its stock is counted and reported; nothing can then be posted into it until it is reopened.</p>
        </div>
        <div class="page-actions">
            <button type="button" class="btn-icon border border-gray-200 dark:border-gray-700" data-year-step="-1" aria-label="Previous year">
                <svg class="icon" aria-hidden="true"><use th:href="@{/images/icons.svg#chevron-left}"/></svg></button>
            <span class="min-w-[4rem] text-center font-semibold tabular-nums" data-year-label th:text="${year}">2026</span>
            <button type="button" class="btn-icon border border-gray-200 dark:border-gray-700" data-year-step="1" aria-label="Next year">
                <svg class="icon" aria-hidden="true"><use th:href="@{/images/icons.svg#chevron-right}"/></svg></button>
        </div>
    </div>

    <div class="card overflow-hidden">
        <div class="table-wrap">
            <table class="table-grid" data-periods>
                <thead>
                <tr><th>Month</th><th>Status</th><th class="text-right">Stock moves</th><th class="text-right">Unposted drafts</th>
                    <th>Closed</th><th>Reopened</th><th>Remarks</th><th class="w-px"></th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script th:src="@{/js/supply-stock.js}" defer></script>
</div>
</body>
</html>

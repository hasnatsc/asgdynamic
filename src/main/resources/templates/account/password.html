<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Standalone, like login.html: while a password change is forced, every other route redirects
     here, so this page must not depend on the main layout or anything it loads. -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ASG FabricERP | Change password</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-sm">
    <div class="text-center mb-6">
        <h1 class="text-xl font-semibold"><span class="text-brand-600">ASG</span> FabricERP</h1>
        <p class="text-sm text-slate-500">Change password</p>
    </div>

    <div class="card p-6 space-y-4">
        <p th:if="${forced}" class="text-sm text-amber-800 bg-amber-50 rounded-md px-3 py-2">
            Your password was set by an administrator. Choose your own before continuing.
        </p>
        <p th:if="${error}" th:text="${error}" class="text-sm text-red-600 bg-red-50 rounded-md px-3 py-2">
            Error
        </p>

        <form th:action="@{/account/password}" method="post" class="space-y-4">
            <div>
                <label class="label" for="currentPassword">Current password</label>
                <input id="currentPassword" name="currentPassword" type="password" class="field"
                       autocomplete="current-password" required autofocus>
            </div>
            <div>
                <label class="label" for="newPassword">New password</label>
                <input id="newPassword" name="newPassword" type="password" class="field"
                       autocomplete="new-password" th:minlength="${minLength}" required>
                <p class="mt-1 text-xs text-slate-500">
                    At least <span th:text="${minLength}">12</span> characters. A long phrase beats
                    a short word with symbols.
                </p>
            </div>
            <div>
                <label class="label" for="confirmPassword">Confirm new password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" class="field"
                       autocomplete="new-password" th:minlength="${minLength}" required>
            </div>
            <button type="submit" class="btn-primary w-full">Change password</button>
        </form>

        <form th:action="@{/logout}" method="post" class="text-center">
            <button type="submit" class="btn-ghost text-sm">Sign out</button>
        </form>
    </div>
</div>

</body>
</html>

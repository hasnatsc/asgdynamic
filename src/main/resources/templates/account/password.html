<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Standalone, like login.html: while a password change is forced, every other route redirects
     here, so this page must not depend on the main layout or anything it loads. -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password · FABRICS LTD. ERP</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo-mark.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="weave-light flex min-h-screen items-center justify-center bg-gray-50 px-4 py-10 font-sans text-[14px] text-gray-900 antialiased">

<div class="w-full max-w-[420px]">
    <img th:src="@{/images/logo.png}" alt="FABRICS LTD." class="mx-auto mb-8 h-10 w-auto" width="645" height="175">

    <div class="card space-y-5 p-7 shadow-float">
        <div>
            <h1 class="text-xl font-semibold tracking-tight">Change password</h1>
            <p class="mt-1 text-sm text-gray-500">Choose a password only you know.</p>
        </div>
        <p th:if="${forced}" class="alert-warn">
            Your password was set by an administrator. Choose your own before continuing.
        </p>
        <p th:if="${error}" th:text="${error}" class="alert-error" role="alert">Error</p>

        <form th:action="@{/account/password}" method="post" class="space-y-4" id="passwordForm">
            <div>
                <label class="label" for="currentPassword">Current password</label>
                <input id="currentPassword" name="currentPassword" type="password" class="field"
                       autocomplete="current-password" required autofocus>
            </div>
            <div>
                <label class="label" for="newPassword">New password</label>
                <input id="newPassword" name="newPassword" type="password" class="field"
                       autocomplete="new-password" th:minlength="${minLength}" required>
                <div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-gray-100" aria-hidden="true">
                    <div id="lengthBar" class="h-1.5 w-0 rounded-full bg-red-500 transition-all"></div>
                </div>
                <p class="hint" id="lengthHint">
                    At least <span th:text="${minLength}">12</span> characters. A long phrase beats a short word with symbols.
                </p>
            </div>
            <div>
                <label class="label" for="confirmPassword">Confirm new password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" class="field"
                       autocomplete="new-password" th:minlength="${minLength}" required>
                <p class="hint text-red-600" id="matchHint" hidden>The passwords do not match yet.</p>
            </div>
            <label class="inline-flex items-center gap-2 text-sm text-gray-600">
                <input type="checkbox" class="checkbox" id="showPasswords"> Show passwords
            </label>
            <button type="submit" class="btn-primary btn-lg w-full">Change password</button>
        </form>

        <div class="flex items-center justify-between border-t border-gray-100 pt-4">
            <a th:unless="${forced}" th:href="@{/}" class="text-sm font-medium text-gray-500 hover:text-gray-900">&larr; Back to dashboard</a>
            <form th:action="@{/logout}" method="post" class="ml-auto">
                <button type="submit" class="btn-subtle btn-sm">Sign out</button>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // Guidance only - PasswordPolicy on the server is what decides.
    (function () {
        const min = /*[[${minLength}]]*/ 12;
        const next = document.getElementById('newPassword');
        const confirm = document.getElementById('confirmPassword');
        const bar = document.getElementById('lengthBar');
        const hint = document.getElementById('lengthHint');
        const matchHint = document.getElementById('matchHint');

        function update() {
            const len = next.value.length;
            const pct = Math.min(100, Math.round(100 * len / (min * 1.5)));
            bar.style.width = pct + '%';
            bar.className = 'h-1.5 rounded-full transition-all ' + (len < min ? 'bg-red-500' : len < min * 1.5 ? 'bg-amber-500' : 'bg-emerald-500');
            hint.textContent = len === 0 ? `At least ${min} characters. A long phrase beats a short word with symbols.`
                : len < min ? `${min - len} more character${min - len === 1 ? '' : 's'} needed.`
                : 'Long enough.';
            matchHint.hidden = !confirm.value || confirm.value === next.value;
        }
        next.addEventListener('input', update);
        confirm.addEventListener('input', update);
        document.getElementById('showPasswords').addEventListener('change', e => {
            document.querySelectorAll('#passwordForm input[type=password], #passwordForm input[data-shown]').forEach(input => {
                input.type = e.target.checked ? 'text' : 'password';
                input.toggleAttribute('data-shown', e.target.checked);
            });
        });
        document.getElementById('passwordForm').addEventListener('submit', e => {
            if (next.value !== confirm.value) {
                e.preventDefault();
                matchHint.hidden = false;
                confirm.focus();
            }
        });
    })();
</script>
</body>
</html>

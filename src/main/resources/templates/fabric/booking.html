<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!--
  Reference implementation of a fabric master-detail screen.

  Legacy equivalent: /booking/index — 275 KB, 95 fields, a Bootstrap modal and ~88 KB of
  inline JavaScript. The structure here is what the other fabric document types copy:
  filter bar, grid, header form, fabric line table, action bar.

  Note what is NOT editable: GSM, line amount and totals are rendered read-only because
  the server computes them. The legacy screen let the browser calculate and submit them.
-->
<head>
    <title>Booking</title>
</head>
<body>
<div th:fragment="content">

    <div class="flex items-center justify-between mb-5">
        <div>
            <h1 class="text-xl font-semibold">Booking</h1>
            <p class="text-sm text-slate-500">Buyer order for woven fabric — start of order-to-cash.</p>
        </div>
        <button type="button" class="btn-primary" data-action="booking-new">New booking</button>
    </div>

    <!-- Filters feed the grid query, not a client-side search -->
    <div class="card p-4 mb-4 grid grid-cols-1 gap-3 sm:grid-cols-4">
        <div>
            <label class="label" for="filterStatus">Status</label>
            <select id="filterStatus" class="field">
                <option value="">All</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}">DRAFT</option>
            </select>
        </div>
        <div>
            <label class="label" for="filterFrom">From</label>
            <input id="filterFrom" type="date" class="field">
        </div>
        <div>
            <label class="label" for="filterTo">To</label>
            <input id="filterTo" type="date" class="field">
        </div>
        <div class="flex items-end">
            <button type="button" class="btn-ghost w-full" data-action="booking-filter">Apply</button>
        </div>
    </div>

    <div class="card overflow-hidden">
        <table id="bookingTable" class="table-grid">
            <thead>
            <tr>
                <th data-sort="documentNo">Booking No</th>
                <th data-sort="documentDate">Date</th>
                <th>Reference</th>
                <th>Currency</th>
                <th data-sort="totalQuantity" class="text-right">Quantity</th>
                <th data-sort="subtotalAmount" class="text-right">Amount</th>
                <th data-sort="revisionNo" class="text-right">Rev.</th>
                <th data-sort="status">Status</th>
                <th class="text-right">Action</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <form id="bookingForm" class="card mt-6 p-5 space-y-5" th:object="${booking}">
        <input type="hidden" th:field="*{id}">

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-4">
            <div>
                <label class="label" for="partyId">Buyer</label>
                <select id="partyId" class="field" th:field="*{partyId}" data-lookup="customer"></select>
            </div>
            <div>
                <label class="label" for="documentDate">Booking date</label>
                <input id="documentDate" type="date" class="field" th:field="*{documentDate}">
            </div>
            <div>
                <label class="label" for="requiredDate">Required by</label>
                <input id="requiredDate" type="date" class="field" th:field="*{requiredDate}">
            </div>
            <div>
                <label class="label" for="currencyCode">Currency</label>
                <select id="currencyCode" class="field" th:field="*{currencyCode}" data-lookup="currency"></select>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
                <label class="label" for="referenceNo">Buyer reference</label>
                <input id="referenceNo" class="field" th:field="*{referenceNo}">
            </div>
            <div>
                <label class="label" for="remarks">Remarks</label>
                <input id="remarks" class="field" th:field="*{remarks}">
            </div>
        </div>

        <!-- Fabric lines -->
        <section>
            <div class="flex items-center justify-between mb-2">
                <h2 class="font-medium">Fabric lines</h2>
                <button type="button" class="btn-ghost" data-action="line-add">Add line</button>
            </div>

            <div class="overflow-x-auto">
                <table class="table-grid" id="lineTable">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Costing code</th>
                        <th>Construction</th>
                        <th>Weave type</th>
                        <th>Weave style</th>
                        <th>Finish</th>
                        <th>Light source</th>
                        <th>Selvedge</th>
                        <th>Colour</th>
                        <th class="text-right">GSM</th>
                        <th class="text-right">Quantity</th>
                        <th class="text-right">Rate</th>
                        <th class="text-right">Amount</th>
                        <th class="text-right">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="line, i : *{lines}">
                        <td th:text="${line.lineNo}">1</td>
                        <td><input class="field" th:field="*{lines[__${i.index}__].fabric.costingCode}"></td>
                        <!-- Construction and GSM arrive from the costing service on save -->
                        <td><input class="field" th:field="*{lines[__${i.index}__].fabric.construction}"></td>
                        <td>
                            <select class="field" data-lookup="fabric/weave-type"
                                    th:field="*{lines[__${i.index}__].fabric.weaveType}"></select>
                        </td>
                        <td>
                            <select class="field" data-lookup="fabric/weave-style"
                                    th:field="*{lines[__${i.index}__].fabric.weaveStyle}"></select>
                        </td>
                        <td>
                            <select class="field" data-lookup="fabric/finish-type"
                                    th:field="*{lines[__${i.index}__].fabric.finishType}"></select>
                        </td>
                        <td>
                            <select class="field" data-lookup="fabric/light-source"
                                    th:field="*{lines[__${i.index}__].fabric.lightSource}"></select>
                        </td>
                        <td>
                            <select class="field" data-lookup="fabric/selvedge"
                                    th:field="*{lines[__${i.index}__].fabric.selvedge}"></select>
                        </td>
                        <td><input class="field" th:field="*{lines[__${i.index}__].fabric.colourName}"></td>
                        <td class="text-right text-slate-500" th:text="${line.fabric.gsm}">—</td>
                        <td><input type="number" step="0.0001" class="field text-right"
                                   th:field="*{lines[__${i.index}__].quantity}"></td>
                        <td><input type="number" step="0.000001" class="field text-right"
                                   th:field="*{lines[__${i.index}__].rate}"></td>
                        <td class="text-right text-slate-500" th:text="${line.lineAmount}">—</td>
                        <td class="text-right">
                            <button type="button" class="btn-ghost" data-action="line-remove">Remove</button>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr class="font-medium">
                        <td colspan="10" class="text-right">Total</td>
                        <td class="text-right" th:text="*{totalQuantity}">0</td>
                        <td></td>
                        <td class="text-right" th:text="*{subtotalAmount}">0</td>
                        <td></td>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </section>

        <div class="flex items-center gap-2 pt-2 border-t border-slate-200">
            <button type="submit" class="btn-primary">Save</button>
            <button type="button" class="btn-ghost" data-action="booking-submit">Submit</button>
            <!-- Only offered on a committed booking; the server enforces it regardless -->
            <button type="button" class="btn-ghost" data-action="booking-revise">Raise revision</button>
        </div>
    </form>

</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!--
  Third fabric document type, same pattern as fabric/bpo.html: pick a parent (here a BPO
  instead of a Booking), draw lines against its open source lines. No costing fields on
  this one — RequestForPiService has no CostingService dependency; a Request-for-PI
  schedules delivery of fabric already costed at the BPO stage, it does not re-cost it.
-->
<head>
    <title>Request For PI</title>
</head>
<body>
<div th:fragment="content">

    <div class="flex items-center justify-between mb-5">
        <div>
            <h1 class="text-xl font-semibold">Request For PI</h1>
            <p class="text-sm text-slate-500">Delivery schedule raised against a BPO.</p>
        </div>
        <button type="button" class="btn-primary" data-action="rpi-new">New Request For PI</button>
    </div>

    <div class="card p-4 mb-4 grid grid-cols-1 gap-3 sm:grid-cols-4">
        <div>
            <label class="label" for="filterStatus">Status</label>
            <select id="filterStatus" class="field">
                <option value="">All</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}">DRAFT</option>
            </select>
        </div>
        <div>
            <label class="label" for="filterFrom">From</label>
            <input id="filterFrom" type="date" class="field">
        </div>
        <div>
            <label class="label" for="filterTo">To</label>
            <input id="filterTo" type="date" class="field">
        </div>
        <div class="flex items-end">
            <button type="button" class="btn-ghost w-full" data-action="rpi-filter">Apply</button>
        </div>
    </div>

    <div class="card overflow-hidden">
        <table id="rpiTable" class="table-grid">
            <thead>
            <tr>
                <th data-sort="documentNo">RPI No</th>
                <th data-sort="documentDate">Date</th>
                <th data-sort="totalQuantity" class="text-right">Quantity</th>
                <th data-sort="revisionNo" class="text-right">Rev.</th>
                <th data-sort="status">Status</th>
                <th class="text-right">Action</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <form id="rpiForm" class="card mt-6 p-5 space-y-5" th:object="${rpi}">
        <input type="hidden" th:field="*{id}">

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
            <div>
                <label class="label" for="parentDocumentId">Against BPO</label>
                <select id="parentDocumentId" class="field" th:field="*{parentDocumentId}"
                        data-lookup="bpo" data-action="rpi-bpo-selected"></select>
            </div>
            <div>
                <label class="label" for="documentDate">Schedule date</label>
                <input id="documentDate" type="date" class="field" th:field="*{documentDate}">
            </div>
            <div>
                <label class="label" for="requiredDate">Delivery required by</label>
                <input id="requiredDate" type="date" class="field" th:field="*{requiredDate}">
            </div>
        </div>

        <div>
            <label class="label" for="remarks">Remarks</label>
            <input id="remarks" class="field" th:field="*{remarks}">
        </div>

        <section>
            <div class="flex items-center justify-between mb-2">
                <h2 class="font-medium">Schedule lines</h2>
                <button type="button" class="btn-ghost" data-action="line-add"
                        title="Enabled once a BPO is selected">Add line</button>
            </div>

            <div class="overflow-x-auto">
                <table class="table-grid" id="lineTable">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Source (BPO line)</th>
                        <th>Construction</th>
                        <th>Colour</th>
                        <th class="text-right">Quantity</th>
                        <th class="text-right">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="line, i : *{lines}">
                        <td th:text="${line.lineNo}">1</td>
                        <td>
                            <select class="field" data-role="source-line-picker"
                                    th:field="*{lines[__${i.index}__].sourceLineId}"></select>
                        </td>
                        <td><input class="field" th:field="*{lines[__${i.index}__].fabric.construction}"></td>
                        <td><input class="field" th:field="*{lines[__${i.index}__].fabric.colourName}"></td>
                        <td><input type="number" step="0.0001" class="field text-right"
                                   th:field="*{lines[__${i.index}__].quantity}"></td>
                        <td class="text-right">
                            <button type="button" class="btn-ghost" data-action="line-remove">Remove</button>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr class="font-medium">
                        <td colspan="4" class="text-right">Total</td>
                        <td class="text-right" th:text="*{totalQuantity}">0</td>
                        <td></td>
                    </tr>
                    </tfoot>
                </table>
            </div>
            <p class="text-xs text-slate-500 mt-2">
                A line's quantity can never exceed what its source BPO line still has
                outstanding — enforced server-side on save.
            </p>
        </section>

        <!-- Same generic /api/documents/{id}/... endpoints as Booking and BPO. -->
        <div class="flex items-center gap-2 pt-2 border-t border-slate-200">
            <button type="submit" class="btn-primary">Save</button>
            <button type="button" class="btn-ghost" data-action="doc-submit">Submit</button>
            <button type="button" class="btn-ghost" data-action="doc-approve">Approve</button>
            <button type="button" class="btn-ghost" data-action="doc-reject">Reject</button>
            <button type="button" class="btn-ghost" data-action="rpi-revise">Raise revision</button>
        </div>
    </form>

</div>
</body>
</html>
